[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeguard-ai"
version = "0.1.0"
description = "Evidence-driven multi-sensor building monitoring demonstrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PUI89" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "setuptools>=84.1.0"]

[project.scripts]
homeguard-simulate = "homeguard_ai.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
