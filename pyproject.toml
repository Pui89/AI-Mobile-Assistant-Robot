[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pui89-ai-nomad"
version = "0.2.0"
description = "PUI89 AI NOMAD travel-suitcase assistant software foundations; product-specific travel and robotics capabilities remain under development"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PUI89" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[project.scripts]
pui89-nomad-legacy-evidence-simulate = "homeguard_ai.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
