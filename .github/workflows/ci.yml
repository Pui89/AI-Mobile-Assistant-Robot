name: HOMEGUARD CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: homeguard-simulate --seed 89 --output homeguard-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: homeguard-simulation-report
          path: homeguard-report.json
