name: HOMEGUARD CI
on:
  push:
    branches: [main, "feat/**", "security/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homeguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared project test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run deterministic simulation
        run: homeguard-simulate --seed 89 --output homeguard-report.json
      - name: Print simulation report summary
        run: python -c "from pathlib import Path; p=Path('homeguard-report.json'); print(p.read_text() if p.exists() else 'Report missing')"
