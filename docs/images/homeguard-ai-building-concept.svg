<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">HOMEGUARD AI — intelligent building, evidence and decision concept</title>
<desc id="desc">A clear system concept. Building sensors observe a three-floor building. Their evidence is quality-checked, located in a building spatial model and compared with baselines. The system reports what is known, unknown, changed, what might fail, recommendations, supporting evidence and whether improvement is proven. A human reviews decisions. Certified alarms remain primary.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset=".55" stop-color="#0a2038"/><stop offset="1" stop-color="#102d49"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f91b8"/><stop offset=".5" stop-color="#8afaff"/><stop offset="1" stop-color="#18b9df"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#153957"/><stop offset="1" stop-color="#0b223b"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#57e6f8"/></marker>
 <style>
 text{font-family:Inter,Segoe UI,Arial,sans-serif}.ey{font-size:17px;font-weight:800;letter-spacing:3px;fill:#6deaf8}
 .title{font-size:52px;font-weight:850;fill:#f1f8ff}.sub{font-size:22px;fill:#b8cce0}
 .head{font-size:20px;font-weight:800;letter-spacing:1px;fill:#eff8ff}.body{font-size:17px;fill:#c6d8e8}
 .small{font-size:14px;fill:#9eb7cc}.tiny{font-size:12px;fill:#91acc3}
 .panel{fill:url(#panel);stroke:#2a607e;stroke-width:2}.sensor{fill:#102f4b;stroke:#3188a7;stroke-width:2}
 .trace{fill:none;stroke:#53e5f8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
<rect width="1600" height="1000" rx="30" fill="url(#bg)"/>
<circle cx="1370" cy="110" r="230" fill="#0c7191" opacity=".09"/><circle cx="100" cy="900" r="230" fill="#0c7191" opacity=".07"/>
<text x="70" y="65" class="ey">PUI89  /  BUILDING INTELLIGENCE</text>
<text x="70" y="132" class="title">HOMEGUARD AI</text>
<text x="73" y="174" class="sub">A building that can explain its condition — with evidence.</text>
<g transform="translate(1215 78)"><rect width="310" height="64" rx="32" fill="#123c51" stroke="#3bd7ed" stroke-width="2"/><circle cx="32" cy="32" r="8" fill="#83f7ff" filter="url(#glow)"/><text x="58" y="39" font-size="16" font-weight="800" fill="#c5faff" letter-spacing="1">DETECT • LOCATE • VERIFY</text></g>
<path d="M70 210 H1530" stroke="#28506b" stroke-width="2"/>
<!-- LEFT: building model -->
<text x="75" y="258" class="ey">01 / THE BUILDING</text>
<text x="75" y="289" class="head">One spatial picture</text>
<text x="75" y="317" class="small">Building → floor → room → component → sensor</text>
<g transform="translate(78 350)">
 <path d="M0 0 H500 V490 H0 Z" rx="18" fill="#091d32" stroke="#2b607e" stroke-width="2"/>
 <rect x="24" y="24" width="452" height="132" rx="8" fill="#102f4c" stroke="#36708e" stroke-width="2"/>
 <rect x="24" y="168" width="452" height="132" rx="8" fill="#0e2945" stroke="#36708e" stroke-width="2"/>
 <rect x="24" y="312" width="452" height="132" rx="8" fill="#102f4c" stroke="#36708e" stroke-width="2"/>
 <g fill="#e8f6ff" font-size="18" font-weight="800"><text x="48" y="61">FLOOR 03</text><text x="48" y="205">FLOOR 02</text><text x="48" y="349">FLOOR 01</text></g>
 <g fill="#9fb9ce" font-size="13"><text x="48" y="88">Rooms • roof • structure</text><text x="48" y="232">Rooms • electrical • air</text><text x="48" y="376">Entry • water • foundation</text></g>
 <g fill="#173f5c" stroke="#4b91ae" stroke-width="1.5"><rect x="270" y="43" width="120" height="74" rx="8"/><rect x="270" y="187" width="120" height="74" rx="8"/><rect x="270" y="331" width="120" height="74" rx="8"/></g>
 <g fill="#bcefff" font-size="13" font-weight="700" text-anchor="middle"><text x="330" y="85">ROOM / SENSOR</text><text x="330" y="229">ROOM / SENSOR</text><text x="330" y="373">ROOM / SENSOR</text></g>
 <g fill="#6df0ff" stroke="#09243b" stroke-width="3"><circle cx="430" cy="80" r="11"/><circle cx="430" cy="224" r="11"/><circle cx="430" cy="368" r="11"/></g>
 <path d="M430 91 V213 M430 235 V357" class="trace" opacity=".8"/>
 <text x="250" y="475" class="tiny" text-anchor="middle">ILLUSTRATIVE SPATIAL MODEL — NOT A REAL BUILDING SCAN</text>
</g>
<!-- sensor inputs -->
<text x="630" y="258" class="ey">02 / OBSERVATIONS</text><text x="630" y="289" class="head">Many evidence sources</text>
<g transform="translate(630 318)">
 <g><rect class="sensor" width="190" height="62" rx="12"/><text x="18" y="27" class="body" font-weight="700">STRUCTURE</text><text x="18" y="48" class="tiny">Vibration • strain • cracks</text></g>
 <g transform="translate(205 0)"><rect class="sensor" width="190" height="62" rx="12"/><text x="18" y="27" class="body" font-weight="700">ELECTRICAL</text><text x="18" y="48" class="tiny">Power • panel indicators</text></g>
 <g transform="translate(0 78)"><rect class="sensor" width="190" height="62" rx="12"/><text x="18" y="27" class="body" font-weight="700">WATER</text><text x="18" y="48" class="tiny">Leak • moisture • humidity</text></g>
 <g transform="translate(205 78)"><rect class="sensor" width="190" height="62" rx="12"/><text x="18" y="27" class="body" font-weight="700">AIR &amp; GAS</text><text x="18" y="48" class="tiny">Qualified gas / air sensors</text></g>
 <g transform="translate(0 156)"><rect class="sensor" width="190" height="62" rx="12"/><text x="18" y="27" class="body" font-weight="700">ACOUSTIC</text><text x="18" y="48" class="tiny">Sound • equipment changes</text></g>
 <g transform="translate(205 156)"><rect class="sensor" width="190" height="62" rx="12"/><text x="18" y="27" class="body" font-weight="700">LIGHT &amp; THERMAL</text><text x="18" y="48" class="tiny">Light • heat • temperature</text></g>
</g>
<path d="M580 575 H615" class="trace" marker-end="url(#arr)"/>
<!-- core gate -->
<g transform="translate(630 575)"><rect width="395" height="255" rx="18" class="panel"/>
 <text x="24" y="40" class="ey">03 / EVIDENCE QUALITY GATE</text><text x="24" y="75" class="head">Check before trust</text>
 <g class="body"><text x="28" y="115">✓ Timestamp, freshness &amp; clock quality</text><text x="28" y="151">✓ Calibration, sensor health &amp; units</text><text x="28" y="187">✓ Missing, stale &amp; conflicting data</text><text x="28" y="223">✓ Baseline, provenance &amp; uncertainty</text></g>
</g>
<path d="M1025 700 H1060" class="trace" marker-end="url(#arr)"/>
<!-- AI core -->
<g transform="translate(1075 575)"><rect width="450" height="255" rx="18" class="panel"/>
 <text x="25" y="40" class="ey">04 / HOMEGUARD AI CORE</text>
 <g transform="translate(28 64)"><circle cx="70" cy="70" r="60" fill="#0d3e5a" stroke="#45e4f6" stroke-width="3" filter="url(#glow)"/><circle cx="70" cy="70" r="42" fill="#0b2944" stroke="#8af7ff" stroke-width="2"/><path d="M70 32 V108 M32 70 H108 M43 43 L97 97 M97 43 L43 97" stroke="#84f7ff" stroke-width="3" fill="none"/></g>
 <text x="185" y="104" class="head">Building world-state</text><text x="185" y="139" class="body">Known • Unknown • Changed</text><text x="185" y="172" class="body">Conflicting • At risk • Uncertain</text><text x="185" y="205" class="body">Explainable • Traceable • Reviewable</text>
</g>
<!-- seven evidence questions -->
<text x="75" y="895" class="ey">05 / THE SYSTEM MUST EXPLAIN</text>
<g transform="translate(75 920)">
 <text y="0" class="body">What do we know?</text><text x="200" y="0" class="body">What is unknown?</text><text x="405" y="0" class="body">What changed?</text><text x="580" y="0" class="body">What might fail?</text><text x="785" y="0" class="body">What is recommended?</text><text x="1035" y="0" class="body">What evidence supports it?</text><text x="1320" y="0" class="body">Did it improve?</text>
</g>
<rect x="75" y="940" width="1450" height="42" rx="10" fill="#091a2c" stroke="#2b536d"/>
<text x="96" y="967" font-size="14" font-weight="800" fill="#aef5ff">HUMAN REVIEW REQUIRED</text>
<text x="370" y="967" font-size="14" fill="#b3c8d9">Certified fire / smoke / CO / electrical protection remains primary. No automatic building control.</text>
</svg>