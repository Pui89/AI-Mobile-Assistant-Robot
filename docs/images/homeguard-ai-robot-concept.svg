<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">PUI89 Homeguard AI — 3D-style autonomous home protection robot concept</title>
<desc id="desc">A compact friendly rounded deep-navy robot with electric-cyan sensor rings, concealed wheels, protected cameras and a matching automatic charging dock. Concept illustration only.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152B"/><stop offset=".55" stop-color="#102B4A"/><stop offset="1" stop-color="#061326"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#16D9F5" stop-opacity=".22"/><stop offset="1" stop-color="#16D9F5" stop-opacity="0"/></radialGradient>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#365578"/><stop offset=".28" stop-color="#142F50"/><stop offset=".72" stop-color="#091B32"/><stop offset="1" stop-color="#06101F"/></linearGradient>
  <linearGradient id="shellTop" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#557493"/><stop offset=".35" stop-color="#203F60"/><stop offset="1" stop-color="#10243D"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B5FBFF"/><stop offset=".35" stop-color="#35E7FF"/><stop offset="1" stop-color="#00A9D4"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123D5D"/><stop offset=".5" stop-color="#071625"/><stop offset="1" stop-color="#1B526C"/></linearGradient>
  <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#294966"/><stop offset="1" stop-color="#08182B"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
  <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#6AB9D4" stroke-opacity=".08" stroke-width="1"/></pattern>
</defs>
<rect width="1600" height="1000" rx="38" fill="url(#bg)"/>
<rect width="1600" height="1000" rx="38" fill="url(#grid)"/>
<ellipse cx="720" cy="505" rx="620" ry="460" fill="url(#halo)"/>
<path d="M90 790H1510" stroke="#4ACDE8" stroke-opacity=".18"/>
<text x="100" y="105" fill="#8DEEFF" font-family="Arial,sans-serif" font-size="23" letter-spacing="7">PUI89 / HOMEGUARD AI</text>
<text x="100" y="165" fill="#F1FAFF" font-family="Arial,sans-serif" font-size="48" font-weight="700">Autonomous Home Protection</text>
<text x="102" y="207" fill="#9ABAD0" font-family="Arial,sans-serif" font-size="23">3D concept study · PROPOSED DESIGN · NOT BUILT OR CERTIFIED</text>

