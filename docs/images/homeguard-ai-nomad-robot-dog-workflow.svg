<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">HOMEGUARD AI NOMAD robot dog workflow</title><desc id="d">Supervised robot dog workflow: observe, verify evidence, understand context, choose safe movement and report to owner; safe stop if return is not safe.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#123653"/></linearGradient><style>.h{font:800 34px Arial;fill:#f4faff}.s{font:18px Arial;fill:#b9d2e2}.k{font:700 21px Arial;fill:#f4faff}.m{font:700 15px Arial;letter-spacing:2px;fill:#72eaff}.p{fill:#102940;stroke:#3e6b87;stroke-width:2}</style></defs><rect width="1400" height="760" rx="24" fill="url(#bg)"/><text x="60" y="70" class="m">PUI89 · HOMEGUARD AI NOMAD</text><text x="60" y="125" class="h">HOW THE ROBOT DOG IS INTENDED TO WORK</text><text x="60" y="162" class="s">Outdoor awareness with evidence checks, safe movement and owner supervision</text><g transform="translate(65 300)"><path d="M40 140Q70 85 150 85H380Q430 95 455 150L440 245H75Z" fill="#1a405d" stroke="#78a9c8" stroke-width="5"/><path d="M390 110L450 72L510 110L500 190L425 190Z" fill="#12334f" stroke="#67dff4" stroke-width="4"/><circle cx="463" cy="133" r="17" fill="#8bf5ff"/><circle cx="463" cy="133" r="7" fill="#061426"/><g fill="none" stroke="#6f94af" stroke-width="29" stroke-linecap="round"><path d="M110 220L90 300L75 365"/><path d="M190 230L185 300L205 365"/><path d="M365 225L390 300L405 365"/><path d="M430 205L460 290L475 355"/></g><g fill="#071321" stroke="#8bb7ce" stroke-width="3"><rect x="48" y="350" width="58" height="22" rx="10"/><rect x="178" y="350" width="58" height="22" rx="10"/><rect x="378" y="350" width="58" height="22" rx="10"/><rect x="448" y="340" width="58" height="22" rx="10"/></g><text x="260" y="425" class="k" text-anchor="middle">QUADRUPED ROBOT DOG</text><text x="260" y="455" class="s" text-anchor="middle">Proposed outdoor platform</text></g><g><rect x="620" y="225" width="330" height="130" rx="18" class="p"/><text x="650" y="270" class="m">01</text><text x="650" y="310" class="k">OBSERVE</text><text x="650" y="337" class="s">Camera / sensor observations*</text><path d="M950 290H995m-13 -12 13 12 -13 12" stroke="#5ee5fa" stroke-width="4" fill="none"/><rect x="1005" y="225" width="335" height="130" rx="18" class="p"/><text x="1035" y="270" class="m">02</text><text x="1035" y="310" class="k">VERIFY EVIDENCE</text><text x="1035" y="337" class="s">Freshness, quality, uncertainty</text><path d="M1170 355V405m-12 -13 12 13 12 -13" stroke="#5ee5fa" stroke-width="4" fill="none"/><rect x="1005" y="420" width="335" height="130" rx="18" class="p"/><text x="1035" y="465" class="m">03</text><text x="1035" y="505" class="k">UNDERSTAND CONTEXT</text><text x="1035" y="532" class="s">Location, time, known state</text><path d="M1005 485H960m13 -12 -13 12 13 12" stroke="#5ee5fa" stroke-width="4" fill="none"/><rect x="620" y="420" width="330" height="130" rx="18" class="p"/><text x="650" y="465" class="m">04</text><text x="650" y="505" class="k">CHOOSE SAFE STATE</text><text x="650" y="532" class="s">Move / pause / return / stop</text><path d="M785 550V600m-12 -13 12 13 12 -13" stroke="#5ee5fa" stroke-width="4" fill="none"/><rect x="620" y="615" width="330" height="100" rx="18" class="p"/><text x="650" y="655" class="m">05</text><text x="650" y="690" class="k">REPORT TO OWNER</text><text x="1005" y="655" class="k">HUMAN DECIDES</text><text x="1005" y="690" class="s">Owner reviews and acts</text></g><text x="60" y="690" class="s">*Concept only — sensors, autonomy, navigation, animal detection and weather resistance are not validated.</text></svg>