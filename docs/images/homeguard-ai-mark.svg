<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">HOMEGUARD AI geometric building intelligence mark</title>
<desc id="desc">A strong geometric three-storey building matrix with squared architectural edges, an electric-cyan central intelligence spine and connected sensor nodes. No roof, house, shield or lock symbol.</desc>
<defs>
 <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153b5c"/><stop offset="1" stop-color="#0b2038"/></linearGradient>
 <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0e789d"/><stop offset=".48" stop-color="#83f8ff"/><stop offset="1" stop-color="#12a9d3"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g transform="translate(100 35)" stroke-linejoin="round">
 <!-- Three solid architectural floor plates -->
 <path d="M35 115 L260 20 L485 115 L260 210 Z" fill="#102e4b" stroke="#2c7da1" stroke-width="5"/>
 <path d="M35 115 V190 L260 285 L485 190 V115 L260 210 Z" fill="url(#slab)" stroke="#286b8c" stroke-width="4"/>
 <path d="M35 250 L260 155 L485 250 L260 345 Z" fill="#123552" stroke="#2c7da1" stroke-width="5"/>
 <path d="M35 250 V325 L260 420 L485 325 V250 L260 345 Z" fill="url(#slab)" stroke="#286b8c" stroke-width="4"/>
 <path d="M35 385 L260 290 L485 385 L260 480 Z" fill="#143b5b" stroke="#2c7da1" stroke-width="5"/>
 <path d="M35 385 V460 L260 555 L485 460 V385 L260 480 Z" fill="url(#slab)" stroke="#286b8c" stroke-width="4"/>
 <!-- Vertical structural members, squared ends -->
 <path d="M83 137 V442 M260 212 V516 M437 137 V442" fill="none" stroke="#4c8eac" stroke-width="13" opacity=".72"/>
 <path d="M260 36 V544" stroke="url(#beam)" stroke-width="12" filter="url(#glow)"/>
 <!-- Internal network: short straight traces and nodes -->
 <g fill="none" stroke="#5beaff" stroke-width="5" stroke-linecap="round" opacity=".95">
  <path d="M260 118 L165 158 L165 250 L260 290 L355 250 L355 385 L260 425"/>
  <path d="M165 250 L83 285 M355 250 L437 285 M165 385 L83 420 M355 385 L437 420"/>
 </g>
 <g fill="#9af8ff" stroke="#0a2b45" stroke-width="5" filter="url(#glow)">
  <circle cx="260" cy="118" r="12"/><circle cx="165" cy="158" r="10"/><circle cx="355" cy="250" r="10"/>
  <circle cx="165" cy="250" r="10"/><circle cx="260" cy="290" r="12"/><circle cx="355" cy="385" r="10"/>
  <circle cx="165" cy="385" r="10"/><circle cx="260" cy="425" r="12"/>
 </g>
 <!-- crisp, square sensor endpoints -->
 <g fill="#69edff" stroke="#0b2b44" stroke-width="4">
  <rect x="70" y="277" width="26" height="26" rx="3"/><rect x="424" y="277" width="26" height="26" rx="3"/>
  <rect x="70" y="412" width="26" height="26" rx="3"/><rect x="424" y="412" width="26" height="26" rx="3"/>
 </g>
</g>
<text x="360" y="600" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" font-weight="800" letter-spacing="5" fill="#eaf7ff">HOMEGUARD <tspan fill="#52e5fa">AI</tspan></text>
</svg>