<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">AI Mobile Assistant Robot — PUI89 quadruped concept</title>
<desc id="desc">A premium isometric engineering concept illustration of a compact four-legged mobile assistant robot with a protected central body, top cargo deck, sensor head, articulated legs and rubberized feet. Titanium silver, deep navy and electric cyan. Concept only; not built or validated.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset=".58" stop-color="#102b46"/><stop offset="1" stop-color="#06101d"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fbff"/><stop offset=".28" stop-color="#9fb5c6"/><stop offset=".58" stop-color="#536d82"/><stop offset="1" stop-color="#d5e2eb"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#294965"/><stop offset=".5" stop-color="#102a43"/><stop offset="1" stop-color="#071727"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a4fbff"/><stop offset=".5" stop-color="#16d5f5"/><stop offset="1" stop-color="#0088c8"/></linearGradient>
 <linearGradient id="darkmetal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#46647c"/><stop offset="1" stop-color="#101f30"/></linearGradient>
