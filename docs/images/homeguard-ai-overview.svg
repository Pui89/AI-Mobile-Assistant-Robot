<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">HOMEGUARD AI — Evidence-driven building intelligence</title>
  <desc id="desc">Concept diagram showing building sensors across three floors sending structural, electrical, water, air, acoustic, light and thermal observations through evidence quality checks into a building world model and human-reviewed findings. Simulation and proposed capabilities are clearly distinguished from certified alarms and real-world validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset=".55" stop-color="#0b1e35"/><stop offset="1" stop-color="#102a46"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7df9ff"/><stop offset="1" stop-color="#17bce5"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#143c61"/><stop offset="1" stop-color="#0d2946"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#132e4c"/><stop offset="1" stop-color="#0b2038"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#39d8f4"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#79eaf7}
      .h1{font-size:42px;font-weight:800;fill:#f3f9ff;letter-spacing:.4px}
      .sub{font-size:19px;fill:#b9cde0}
      .section{font-size:17px;font-weight:800;letter-spacing:1.5px;fill:#eaf6ff}
      .body{font-size:16px;fill:#c2d5e7}
      .small{font-size:13px;fill:#9fb7cc}
      .tiny{font-size:11px;fill:#8da8bf}
      .cyan{fill:#69edff}
      .white{fill:#f3f9ff}
      .muted{fill:#a9bfd3}
      .sensor{fill:#102b47;stroke:#2b789d;stroke-width:1.5}
      .line{fill:none;stroke:#35d4f0;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .dash{fill:none;stroke:#43cfe9;stroke-width:2;stroke-dasharray:7 8;opacity:.8}
      .floor{fill:#0e2945;stroke:#32617f;stroke-width:1.5}
      .card{fill:url(#panel);stroke:#245274;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1440" height="920" rx="28" fill="url(#bg)"/>
  <circle cx="1250" cy="110" r="180" fill="#0e6c91" opacity=".10"/>
  <circle cx="120" cy="820" r="230" fill="#0e6c91" opacity=".08"/>
  <path d="M40 170 H1400" stroke="#254765" stroke-width="1"/>
  <text x="68" y="58" class="eyebrow">PUI89  /  PRODUCT 04</text>
  <text x="68" y="112" class="h1">HOMEGUARD AI</text>
  <text x="70" y="148" class="sub">Evidence-driven intelligence for safer buildings</text>
  <g transform="translate(1110 58)">
    <rect width="260" height="54" rx="27" fill="#153b50" stroke="#2dbbd8"/>
    <circle cx="28" cy="27" r="7" fill="#68eaff" filter="url(#glow)"/>
    <text x="48" y="33" font-size="14" font-weight="800" fill="#b9f7ff" letter-spacing="1">DETECT • LOCATE • VERIFY</text>
  </g>

  <!-- Sensor domains -->
  <text x="68" y="211" class="section">01  /  SENSE THE BUILDING</text>
  <text x="68" y="238" class="small">Different evidence sources. No single sensor tells the whole story.</text>
  <g transform="translate(68 264)">
    <g>
      <rect class="sensor" width="176" height="78" rx="14"/>
      <path d="M20 25 h22 v27 h-22z M25 19 v6 M37 19 v6 M25 34 h12 M25 42 h12" stroke="#6eeeff" stroke-width="2" fill="none"/>
      <text x="57" y="34" class="body" font-weight="700">STRUCTURE</text><text x="57" y="56" class="tiny">Vibration • strain • cracks</text>
    </g>
    <g transform="translate(190 0)">
      <rect class="sensor" width="176" height="78" rx="14"/>
      <path d="M22 17 v32 M14 25 h16 M14 42 h16 M35 20 l9 9 -9 9" stroke="#6eeeff" stroke-width="2" fill="none"/>
      <text x="57" y="34" class="body" font-weight="700">ELECTRICAL</text><text x="57" y="56" class="tiny">Power • panel condition</text>
    </g>
    <g transform="translate(380 0)">
      <rect class="sensor" width="176" height="78" rx="14"/>
      <path d="M30 17 C30 17 17 34 17 42 a13 13 0 0 0 26 0 C43 34 30 17 30 17Z" stroke="#6eeeff" stroke-width="2" fill="none"/>
      <text x="57" y="34" class="body" font-weight="700">WATER</text><text x="57" y="56" class="tiny">Leak • moisture • humidity</text>
    </g>
    <g transform="translate(570 0)">
      <rect class="sensor" width="176" height="78" rx="14"/>
      <path d="M17 43 C23 25 38 25 45 43 M22 48 h18 M30 17 v9" stroke="#6eeeff" stroke-width="2" fill="none"/>
      <text x="57" y="34" class="body" font-weight="700">AIR &amp; GAS</text><text x="57" y="56" class="tiny">Air quality • gas sensors</text>
    </g>
    <g transform="translate(760 0)">
      <rect class="sensor" width="176" height="78" rx="14"/>
      <path d="M16 39 q8 -18 16 0 t16 0 M16 49 q8 -12 16 0 t16 0" stroke="#6eeeff" stroke-width="2" fill="none"/>
      <text x="57" y="34" class="body" font-weight="700">ACOUSTIC</text><text x="57" y="56" class="tiny">Sound • equipment noise</text>
    </g>
    <g transform="translate(950 0)">
      <rect class="sensor" width="176" height="78" rx="14"/>
      <circle cx="30" cy="38" r="12" stroke="#6eeeff" stroke-width="2" fill="none"/><path d="M30 17 v7 M30 52 v7 M9 38 h7 M44 38 h7" stroke="#6eeeff" stroke-width="2"/>
      <text x="57" y="34" class="body" font-weight="700">LIGHT</text><text x="57" y="56" class="tiny">Illumination • flicker</text>
    </g>
    <g transform="translate(1140 0)">
      <rect class="sensor" width="164" height="78" rx="14"/>
      <path d="M30 17 v27 M20 27 h20 M20 44 q10 10 20 0" stroke="#6eeeff" stroke-width="2" fill="none"/>
      <text x="57" y="34" class="body" font-weight="700">THERMAL</text><text x="57" y="56" class="tiny">Heat • cold • temperature</text>
    </g>
  </g>
  <path d="M156 344 V373 H1284 V373" class="dash"/>
  <path d="M156 373 V393 M346 373 V393 M536 373 V393 M726 373 V393 M916 373 V393 M1106 373 V393 M1284 373 V393" class="line" opacity=".55"/>

  <!-- Building cross-section -->
  <text x="68" y="426" class="section">02  /  LOCATE EVIDENCE IN CONTEXT</text>
  <text x="68" y="451" class="small">Building → floor → room → component → sensor</text>
  <g transform="translate(68 478)">
    <rect x="0" y="0" width="500" height="300" rx="18" fill="#0a1c31" stroke="#2a607f" stroke-width="2"/>
    <path d="M0 22 L250 -25 L500 22" fill="#112e4a" stroke="#34728f" stroke-width="2"/>
    <rect x="24" y="25" width="452" height="250" rx="8" fill="#0c2742" stroke="#295575"/>
    <rect x="24" y="25" width="452" height="82" class="floor"/>
    <rect x="24" y="109" width="452" height="82" class="floor"/>
    <rect x="24" y="193" width="452" height="82" class="floor"/>
    <text x="42" y="54" class="section">FLOOR 03</text><text x="42" y="78" class="tiny">Room • ceiling • roof • structure</text>
    <text x="42" y="138" class="section">FLOOR 02</text><text x="42" y="162" class="tiny">Room • electrical • air • water</text>
    <text x="42" y="222" class="section">FLOOR 01</text><text x="42" y="246" class="tiny">Entry • plant • foundation reference</text>
    <g fill="#65eaff" stroke="#0c2742" stroke-width="2">
      <circle cx="410" cy="57" r="8"/><circle cx="350" cy="140" r="8"/><circle cx="410" cy="224" r="8"/>
    </g>
    <g stroke="#65eaff" stroke-width="2" fill="none">
      <path d="M410 65 V94 M350 148 V178 M410 232 V260"/>
      <path d="M394 57 h-24 M334 140 h-24 M394 224 h-24"/>
    </g>
    <g fill="#173e5c" stroke="#4a90ad">
      <rect x="275" y="38" width="74" height="35" rx="7"/><rect x="275" y="122" width="74" height="35" rx="7"/><rect x="275" y="206" width="74" height="35" rx="7"/>
    </g>
    <g fill="#bfefff" font-size="10" font-weight="700" text-anchor="middle">
      <text x="312" y="59">SENSOR</text><text x="312" y="143">SENSOR</text><text x="312" y="227">SENSOR</text>
    </g>
    <text x="250" y="294" class="tiny" text-anchor="middle">CONCEPTUAL SPATIAL MODEL • NOT A REAL BUILDING SURVEY</text>
  </g>

  <!-- Evidence intelligence pipeline -->
  <g transform="translate(610 480)">
    <rect class="card" width="260" height="298" rx="18"/>
    <text x="24" y="38" class="eyebrow">03 / EVIDENCE GATE</text>
    <text x="24" y="72" class="section">Check before trust</text>
    <g transform="translate(24 96)">
      <circle cx="8" cy="8" r="5" fill="#69eaff"/><text x="24" y="13" class="body">Timestamp &amp; freshness</text>
      <circle cx="8" cy="48" r="5" fill="#69eaff"/><text x="24" y="53" class="body">Calibration &amp; sensor health</text>
      <circle cx="8" cy="88" r="5" fill="#69eaff"/><text x="24" y="93" class="body">Units &amp; physical plausibility</text>
      <circle cx="8" cy="128" r="5" fill="#69eaff"/><text x="24" y="133" class="body">Missing / conflicting data</text>
      <circle cx="8" cy="168" r="5" fill="#69eaff"/><text x="24" y="173" class="body">Baseline &amp; uncertainty</text>
    </g>
    <rect x="20" y="276" width="220" height="1" fill="#2d5875"/>
  </g>
  <path d="M570 625 H604" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(910 480)">
    <rect class="card" width="240" height="298" rx="18"/>
    <text x="22" y="38" class="eyebrow">04 / AI CORE</text>
    <circle cx="120" cy="122" r="57" fill="#0d3d5b" stroke="#36d8f3" stroke-width="2" filter="url(#glow)"/>
    <circle cx="120" cy="122" r="43" fill="#0b2844" stroke="#5de8fa" stroke-width="1.5"/>
    <path d="M96 122 h48 M120 98 v48 M103 105 l34 34 M137 105 l-34 34" stroke="#83f3ff" stroke-width="2" opacity=".8"/>
    <text x="120" y="202" text-anchor="middle" class="section">WORLD STATE</text>
    <text x="120" y="229" text-anchor="middle" class="small">Known • Unknown</text>
    <text x="120" y="250" text-anchor="middle" class="small">Changed • Conflicting</text>
    <text x="120" y="271" text-anchor="middle" class="small">Possible • Needs review</text>
  </g>
  <path d="M870 625 H904" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(1190 480)">
    <rect class="card" width="182" height="298" rx="18"/>
    <text x="18" y="38" class="eyebrow">05 / RESPONSE</text>
    <g transform="translate(18 67)">
      <rect width="146" height="43" rx="9" fill="#123c4a" stroke="#36b9c9"/><text x="73" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#b7f7ff">Evidence report</text>
      <rect y="56" width="146" height="43" rx="9" fill="#263b46" stroke="#9eafbd"/><text x="73" y="83" text-anchor="middle" font-size="14" font-weight="700" fill="#e1edf4">Human review</text>
      <rect y="112" width="146" height="43" rx="9" fill="#173a50" stroke="#438cb0"/><text x="73" y="139" text-anchor="middle" font-size="14" font-weight="700" fill="#c9efff">Verify / monitor</text>
    </g>
    <text x="91" y="258" text-anchor="middle" class="tiny">No automatic control</text>
    <text x="91" y="276" text-anchor="middle" class="tiny">of building equipment</text>
  </g>
  <path d="M1150 625 H1184" class="line" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <rect x="68" y="814" width="1304" height="70" rx="14" fill="#0a1a2c" stroke="#31516a"/>
  <g transform="translate(92 834)">
    <circle cx="10" cy="12" r="6" fill="#65eaff"/>
    <text x="28" y="17" font-size="15" font-weight="800" fill="#b9f7ff">CURRENT: FOUNDATION / SIMULATION-ONLY</text>
    <text x="28" y="39" class="small">No real sensor deployment, trained model, certified alarm, structural certification or field performance is claimed.</text>
  </g>
  <path d="M895 830 V868" stroke="#294b65"/>
  <text x="920" y="844" class="small" font-weight="700">CERTIFIED PROTECTION REMAINS PRIMARY</text>
  <text x="920" y="866" class="tiny">AI supports verification; it never replaces alarms or qualified professionals.</text>
</svg>